services:
  mysql:
    image: mysql:8.4
    container_name: inkwell-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${INKWELL_DB_PASSWORD}
      MYSQL_DATABASE: inkwell_platform
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql-init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -p${INKWELL_DB_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 15

  redis:
    image: redis:7-alpine
    container_name: inkwell-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: inkwell-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: inkwell-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

  service-registry:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        SERVICE_DIR: service-registry
    container_name: inkwell-service-registry
    ports:
      - "8761:8761"

  auth-service:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        SERVICE_DIR: Auth-service
    container_name: inkwell-auth-service
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
      kafka:
        condition: service_started
      service-registry:
        condition: service_started
    ports:
      - "8081:8081"
    environment: &common_env
      INKWELL_DB_URL: ${INKWELL_DB_URL}
      INKWELL_DB_USERNAME: ${INKWELL_DB_USERNAME}
      INKWELL_DB_PASSWORD: ${INKWELL_DB_PASSWORD}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE}
      GATEWAY_ALLOWED_ORIGIN: ${GATEWAY_ALLOWED_ORIGIN}
      INKWELL_FRONTEND_URL: ${INKWELL_FRONTEND_URL}
      INKWELL_POST_SERVICE_URL: ${INKWELL_POST_SERVICE_URL}
      INKWELL_COMMENT_SERVICE_URL: ${INKWELL_COMMENT_SERVICE_URL}
      INKWELL_NEWSLETTER_SERVICE_URL: ${INKWELL_NEWSLETTER_SERVICE_URL}
      INKWELL_AUTH_SERVICE_URL: ${INKWELL_AUTH_SERVICE_URL}
      INKWELL_NEWSLETTER_PUBLIC_BASE_URL: ${INKWELL_NEWSLETTER_PUBLIC_BASE_URL}
      INKWELL_INTERNAL_API_KEY: ${INKWELL_INTERNAL_API_KEY}
      AUTH_INTERNAL_API_KEY: ${AUTH_INTERNAL_API_KEY}
      REGISTRATION_TOPIC: ${REGISTRATION_TOPIC}
      INKWELL_NOTIFICATION_KAFKA_TOPIC: ${INKWELL_NOTIFICATION_KAFKA_TOPIC}
      INKWELL_NOTIFICATION_KAFKA_APPLY_SIDE_EFFECTS: ${INKWELL_NOTIFICATION_KAFKA_APPLY_SIDE_EFFECTS}
      INKWELL_NOTIFICATION_UNREAD_CACHE_PREFIX: ${INKWELL_NOTIFICATION_UNREAD_CACHE_PREFIX}
      INKWELL_NOTIFICATION_UNREAD_CACHE_TTL_SECONDS: ${INKWELL_NOTIFICATION_UNREAD_CACHE_TTL_SECONDS}
      INKWELL_POST_VIEW_REDIS_PREFIX: ${INKWELL_POST_VIEW_REDIS_PREFIX}
      INKWELL_POST_VIEW_SESSION_TTL_HOURS: ${INKWELL_POST_VIEW_SESSION_TTL_HOURS}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET}
      MAIL_HOST: ${MAIL_HOST}
      MAIL_PORT: ${MAIL_PORT}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      INKWELL_BILLING_ENABLED: ${INKWELL_BILLING_ENABLED}
      INKWELL_BILLING_CURRENCY: ${INKWELL_BILLING_CURRENCY}
      INKWELL_BILLING_DURATION_DAYS: ${INKWELL_BILLING_DURATION_DAYS}
      INKWELL_FREE_AUTHOR_POST_LIMIT: ${INKWELL_FREE_AUTHOR_POST_LIMIT}
      INKWELL_PLAN_AUTHOR_POSTS_AMOUNT_PAISE: ${INKWELL_PLAN_AUTHOR_POSTS_AMOUNT_PAISE}
      INKWELL_PLAN_NEWSLETTER_AMOUNT_PAISE: ${INKWELL_PLAN_NEWSLETTER_AMOUNT_PAISE}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET}
      INKWELL_MEDIA_STORAGE: ${INKWELL_MEDIA_STORAGE}
      INKWELL_S3_BUCKET: ${INKWELL_S3_BUCKET}
      INKWELL_S3_REGION: ${INKWELL_S3_REGION}
      INKWELL_S3_ENDPOINT: ${INKWELL_S3_ENDPOINT}
      INKWELL_S3_PUBLIC_BASE_URL: ${INKWELL_S3_PUBLIC_BASE_URL}
      INKWELL_S3_PREFIX: ${INKWELL_S3_PREFIX}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_REGION: ${AWS_REGION}

  post-service:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        SERVICE_DIR: post-service
    container_name: inkwell-post-service
    depends_on:
      auth-service:
        condition: service_started
    ports:
      - "8082:8082"
    environment: *common_env

  comment-service:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        SERVICE_DIR: comment-service
    container_name: inkwell-comment-service
    depends_on:
      auth-service:
        condition: service_started
    ports:
      - "8083:8083"
    environment: *common_env

  category-service:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        SERVICE_DIR: category-service
    container_name: inkwell-category-service
    depends_on:
      auth-service:
        condition: service_started
    ports:
      - "8084:8084"
    environment: *common_env

  media-service:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        SERVICE_DIR: media-service
    container_name: inkwell-media-service
    depends_on:
      auth-service:
        condition: service_started
    ports:
      - "8085:8085"
    environment: *common_env

  newsletter-service:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        SERVICE_DIR: newsletter-service
    container_name: inkwell-newsletter-service
    depends_on:
      auth-service:
        condition: service_started
    ports:
      - "8086:8086"
    environment: *common_env

  notification-service:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        SERVICE_DIR: notification-service
    container_name: inkwell-notification-service
    depends_on:
      auth-service:
        condition: service_started
    ports:
      - "8087:8087"
    environment:
      <<: *common_env
      SPRING_KAFKA_CONSUMER_GROUP_ID: notification-service-shadow

  api-gateway:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        SERVICE_DIR: api-gateway
    container_name: inkwell-api-gateway
    depends_on:
      - service-registry
      - auth-service
      - post-service
      - comment-service
      - category-service
      - media-service
      - newsletter-service
      - notification-service
    ports:
      - "8080:8080"
    environment: *common_env

  sonarqube:
    image: sonarqube:lts-community
    container_name: inkwell-sonarqube
    profiles: ["tools"]
    ports:
      - "9000:9000"
    environment:
      SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: "true"
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_logs:/opt/sonarqube/logs
      - sonarqube_extensions:/opt/sonarqube/extensions

volumes:
  mysql_data:
  redis_data:
  sonarqube_data:
  sonarqube_logs:
  sonarqube_extensions:
