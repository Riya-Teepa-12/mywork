server:
  port: 8081
  servlet:
    session:
      cookie:
        name: JSESSIONID
        http-only: true
        same-site: lax
        secure: false
      tracking-modes: cookie

spring:
  application:
    name: auth-service
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:your_google_client_id}
            client-secret: ${GOOGLE_CLIENT_SECRET:your_google_client_secret}
            scope: openid,profile,email
          github:
            client-id: ${GITHUB_CLIENT_ID:your_github_client_id}
            client-secret: ${GITHUB_CLIENT_SECRET:your_github_client_secret}
            scope: read:user,user:email
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
  datasource:
    url: ${AUTH_DB_URL:${INKWELL_DB_URL:jdbc:mysql://localhost:3306/inkwell_platform?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}}
    username: ${AUTH_DB_USERNAME:${INKWELL_DB_USERNAME:root}}
    password: ${AUTH_DB_PASSWORD:${INKWELL_DB_PASSWORD:admin}}
    driver-class-name: ${AUTH_DB_DRIVER:${INKWELL_DB_DRIVER:com.mysql.cj.jdbc.Driver}}
  jpa:
    database-platform: ${AUTH_JPA_DIALECT:${INKWELL_JPA_DIALECT:org.hibernate.dialect.MySQLDialect}}
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:your_mail_username}
    password: ${MAIL_PASSWORD:your_mail_password}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
  instance:
    hostname: localhost
    prefer-ip-address: false

jwt:
  secret: ${JWT_SECRET:mysecretkeymysecretkeymysecretkeymysecretkey}
  expiration-ms: 86400000

app:
  kafka:
    registration-topic: ${REGISTRATION_TOPIC:notification.send}

auth:
  internal-api-key: ${AUTH_INTERNAL_API_KEY:${INKWELL_INTERNAL_API_KEY:ghfyfr7t8hgv7yh}}
  otp:
    expire-minutes: ${AUTH_OTP_EXPIRE_MINUTES:10}
    max-attempts: ${AUTH_OTP_MAX_ATTEMPTS:5}

inkwell:
  frontend-url: ${INKWELL_FRONTEND_URL:http://localhost:5173}
  post-service-url: ${INKWELL_POST_SERVICE_URL:http://localhost:8082}
  notification:
    kafka:
      topic: ${INKWELL_NOTIFICATION_KAFKA_TOPIC:notification.dispatch.v1}
  billing:
    enabled: ${INKWELL_BILLING_ENABLED:true}
    currency: ${INKWELL_BILLING_CURRENCY:INR}
    free-author-post-limit: ${INKWELL_FREE_AUTHOR_POST_LIMIT:5}
    subscription-duration-days: ${INKWELL_BILLING_DURATION_DAYS:30}
    author-posts:
      amount-paise: ${INKWELL_PLAN_AUTHOR_POSTS_AMOUNT_PAISE:49900}
    newsletter:
      amount-paise: ${INKWELL_PLAN_NEWSLETTER_AMOUNT_PAISE:9900}
    razorpay:
      key-id: ${RAZORPAY_KEY_ID:your_razorpay_key_id}
      key-secret: ${RAZORPAY_KEY_SECRET:your_razorpay_secret}
      webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:your_razorpay_webhook_secret}

logging:
  config: "${INKWELL_LOG_CONFIG:file:D:/Inkwell/common-logback-spring.xml}"
  file:
    name: ${INKWELL_LOG_DIR:log}/auth-service.app.log
  level:
    com.app.authservice: INFO
    org.springframework.security: INFO
    org.springframework.web: INFO

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
