server:
  port: 8084

spring:
  application:
    name: category-service
  datasource:
    url: ${CATEGORY_DB_URL:${INKWELL_DB_URL:jdbc:mysql://localhost:3306/inkwell_platform?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}}
    username: ${CATEGORY_DB_USERNAME:${INKWELL_DB_USERNAME:root}}
    password: ${CATEGORY_DB_PASSWORD:${INKWELL_DB_PASSWORD:admin}}
    driver-class-name: ${CATEGORY_DB_DRIVER:${INKWELL_DB_DRIVER:com.mysql.cj.jdbc.Driver}}
  jpa:
    database-platform: ${CATEGORY_JPA_DIALECT:${INKWELL_JPA_DIALECT:org.hibernate.dialect.MySQLDialect}}
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
  instance:
    hostname: localhost
    prefer-ip-address: false

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  config: "${INKWELL_LOG_CONFIG:file:D:/Inkwell/common-logback-spring.xml}"
  file:
    name: ${INKWELL_LOG_DIR:log}/category-service.app.log
  level:
    com.app.categoryservice: INFO
